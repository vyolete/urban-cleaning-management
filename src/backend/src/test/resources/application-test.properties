# Test Profile Configuration

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/urbanclean_test
spring.datasource.username=urbanclean_user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration
spring.flyway.enabled=false

# JWT Configuration
jwt.secret=testSecretKeyForTestingPurposesOnlyDoNotUseInProduction1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
jwt.expiration=3600000
jwt.refresh-token-expiration-days=7

# Session Configuration
session.max-concurrent-sessions=5

# Email Configuration (disabled for tests)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logging
logging.level.com.urbanclean=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Cache Configuration (use simple cache for tests)
spring.cache.type=simple
spring.cache.cache-names=tokenExpirationConfig,duplicateDetectionConfig,taskDistribution,mttr,heatmap,operatorMetrics

# Allow bean overriding for test configurations
spring.main.allow-bean-definition-overriding=true
